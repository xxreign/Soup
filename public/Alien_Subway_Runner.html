let best=0;try{best=Number(localStorage.getItem('alienRunnerBest')||0)}catch{}
const tickets=()=>Math.floor(dist/100)+Math.floor(coins/10);
function updateHud(){$('distance').textContent=Math.floor(dist);$('coins').textContent=coins;$('tickets').textContent=tickets()}
function restart(){state='playing';$('overlay').classList.add('hidden');$('pause').textContent='Ⅱ';lane=1;smoothLane=1;items=[];dist=coins=clock=jump=slide=frame=0;spawn=.45;speed=.47;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);updateHud()}
function fail(){state='over';best=Math.max(best,Math.floor(dist));try{localStorage.setItem('alienRunnerBest',best)}catch{}$('overlay').classList.remove('hidden');$('statusTag').textContent='GAME OVER · BEST '+best+'m';$('heading').innerHTML='TRY<br>AGAIN?';$('intro').textContent=Math.floor(dist)+'m survived · '+coins+' coins · '+tickets()+' tickets earned';$('start').textContent='↻ PLAY AGAIN'}
function pause(){if(state==='playing'){state='paused';$('pause').textContent='▶';$('overlay').classList.remove('hidden');$('statusTag').textContent='GAME PAUSED';$('heading').innerHTML='PAUSED';$('intro').textContent='Your alien is taking a short break.';$('start').textContent='▶ RESUME'}else if(state==='paused'){state='playing';$('overlay').classList.add('hidden');$('pause').textContent='Ⅱ';last=performance.now();raf=requestAnimationFrame(loop)}}
$('start').onclick=()=>state==='paused'?pause():restart();$('pause').onclick=pause;
function move(dir){if(state==='playing')lane=Math.max(0,Math.min(2,lane+dir))}
function action(a){if(state!=='playing')return;if(a==='jump'&&jump===0&&slide===0)jump=.92;if(a==='slide'&&slide===0&&jump===0)slide=.78}
$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('jump').onclick=()=>action('jump');$('slide').onclick=()=>action('slide');
document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS','KeyP'].includes(e.code))return;if(e.target.tagName==='BUTTON')e.target.blur();e.preventDefault();if(e.repeat)return;switch(e.code){case'ArrowLeft':case'KeyA':move(-1);break;case'ArrowRight':case'KeyD':move(1);break;case'ArrowUp':case'KeyW':case'Space':action('jump');break;case'ArrowDown':case'KeyS':action('slide');break;case'KeyP':pause()}});
let touch=null;c.addEventListener('pointerdown',e=>{touch=[e.clientX,e.clientY]});c.addEventListener('pointerup',e=>{if(!touch)return;let dx=e.clientX-touch[0],dy=e.clientY-touch[1];if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy>25)action('slide');else action('jump');touch=null});
function xy(l,z){let t=Math.min(1.2,Math.max(0,z)),p=Math.pow(t,1.34);return{x:240+(l-1)*(39+124*p),y:122+478*p,s:.24+1.25*p}}
function fill(x,y,w,h,color,r=0){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function linePath(ax,ay,bx,by,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke()}
function scene(){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#62a8e6');grad.addColorStop(.24,'#ad76bd');grad.addColorStop(.75,'#42355c');grad.addColorStop(1,'#261b36');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
for(let i=0;i<16;i++){let ht=50+(i*43%103);fill(i*36-7,123-ht,32,ht,i%3===0?'#75487d':'#66547e');for(let j=0;j<3;j++)fill(i*36+1+j*9,126-ht+15+(j*21%35),5,10,'#efb46f')}
fill(0,120,W,12,'#4b2e59');fill(0,132,W,9,'#77537a');
ctx.beginPath();ctx.moveTo(197,122);ctx.lineTo(283,122);ctx.lineTo(565,H);ctx.lineTo(-85,H);ctx.closePath();ctx.fillStyle='#34283d';ctx.fill();
for(let l=-.5;l<3;l++){let a=xy(l,0),b=xy(l,1);linePath(a.x,a.y,b.x,b.y,'#171923',12);linePath(a.x,a.y,b.x,b.y,'#adb9d0',5)}
for(let z=.015;z<1;z+=.06){let t=(z+(dist%8)/120)%1;let y=xy(1,t).y,half=60+218*Math.pow(t,1.3);linePath(240-half,y,240+half,y,'#5c4249',2+3*t)}
for(let side of [-1,1]){let bx=240+side*80,ex=240+side*360;linePath(bx,122,ex,600,'#ffa654',7);linePath(bx+side*12,122,ex+side*12,600,'#462f5b',10)}
items.sort((a,b)=>a.z-b.z);for(let o of items){let p=xy(o.lane,o.z),s=p.s,x=p.x,y=p.y;if(o.type==='coin'){ctx.save();ctx.shadowColor='#ffd75c';ctx.shadowBlur=20*s;ctx.beginPath();ctx.ellipse(x,y-21*s,11*s,15*s,0,0,Math.PI*2);ctx.fillStyle='#ffcd33';ctx.fill();ctx.strokeStyle='#fff0a4';ctx.lineWidth=3*s;ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#d78b1d';ctx.font=`900 ${15*s}px sans-serif`;ctx.textAlign='center';ctx.fillText('★',x,y-16*s);ctx.restore()}else if(o.type==='train'){fill(x-30*s,y-101*s,60*s,104*s,'#28243d',7*s);fill(x-25*s,y-96*s,50*s,91*s,'#e24c81',5*s);fill(x-20*s,y-86*s,40*s,39*s,'#344b73',4*s);fill(x-17*s,y-80*s,15*s,25*s,'#ffda76',2*s);fill(x+3*s,y-80*s,14*s,25*s,'#ffda76',2*s);for(let a of [-17,17])fill(x+a*s-5*s,y-21*s,10*s,9*s,'#fff5b1',4*s)}else if(o.type==='barrier'){fill(x-31*s,y-34*s,62*s,34*s,'#e8e4e3',4*s);for(let i=0;i<4;i++){let xx=x-31*s+i*17*s;ctx.beginPath();ctx.moveTo(xx,y-32*s);ctx.lineTo(xx+9*s,y-32*s);ctx.lineTo(xx-3*s,y-2*s);ctx.lineTo(xx-13*s,y-2*s);ctx.fillStyle='#fc3b55';ctx.fill()}}else if(o.type==='sign'){fill(x-35*s,y-82*s,70*s,15*s,'#ffe17b',4*s);fill(x-35*s,y-80*s,7*s,56*s,'#756d99',2*s);fill(x+28*s,y-80*s,7*s,56*s,'#756d99',2*s)}}
// player + subtle animated shadow
smoothLane+=(lane-smoothLane)*.18;let px=xy(smoothLane,.84).x;let j=jump>0?Math.sin((1-jump/.92)*Math.PI)*90:0;let py=H-106-j+(slide>0?20:0);ctx.beginPath();ctx.ellipse(px,H-45,28*(1-j/180),9*(1-j/180),0,0,Math.PI*2);ctx.fillStyle='#0d102777';ctx.fill();ctx.save();ctx.translate(px,py);let scale=slide>0?.65:1;ctx.scale(scale*(lane-smoothLane>0?.98:1),scale);ctx.rotate(Math.sin(clock*15)*.045);if(hero.complete&&hero.naturalWidth){let hh=155;ctx.drawImage(hero,-hh*.33,-hh*.67,hh*.66,hh)}else{fill(-20,-54,40,72,'#74a84a',12);fill(-14,-44,29,25,'#ef1884',12)}ctx.restore();
ctx.textAlign='center';ctx.font='900 13px system-ui';ctx.fillStyle='#ffffffbb';ctx.fillText('◀  SWITCH LANES  ▶',240,32);
}
function loop(now){if(state!=='playing')return;const dt=Math.min(.036,(now-last)/1000||0);last=now;clock+=dt;dist+=dt*speed*112;speed=Math.min(.93,.47+clock*.004);jump=Math.max(0,jump-dt);slide=Math.max(0,slide-dt);spawn-=dt;
if(spawn<=0){let l=Math.floor(Math.random()*3),r=Math.random();let type=r<.38?'coin':r<.60?'barrier':r<.78?'sign':'train';items.push({lane:l,z:0,type,hit:false});if(type!=='coin'&&Math.random()<.65){let others=[0,1,2].filter(x=>x!==l);items.push({lane:others[Math.floor(Math.random()*2)],z:-.08,type:'coin',hit:false})}if(type==='coin'&&Math.random()<.7)items.push({lane:l,z:-.11,type:'coin',hit:false});spawn=Math.max(.57,1.02-clock*.0025)}
for(let o of items){o.z+=speed*dt;if(o.z>=.85&&!o.hit){o.hit=true;if(o.lane===lane){if(o.type==='coin')coins++;else if(o.type==='barrier'&&jump>.16){}else if(o.type==='sign'&&slide>.14){}else{scene();updateHud();fail();return}}}}
items=items.filter(x=>x.z<1.16);scene();updateHud();raf=requestAnimationFrame(loop)}
hero.onload=()=>{if(state==='ready')scene()};scene();
})();
